name: Forensic evidence validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install offline analysis tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get install -y tshark libimage-exiftool-perl sleuthkit
      - name: Solve the shipped evidence with real tools
        run: python3 tests/forensics.py
