name: Docker stego and browser validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lab-validation.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'package.json'
      - '*.js'
      - 'public/**'
      - 'tests/browser.cjs'
      - 'scripts/prepare-stego.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmolog-lab-validation
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and verify the shipped stego image
        run: |
          sudo apt-get update
          sudo apt-get install -y steghide imagemagick fonts-dejavu-core
          test -s public/uploads/stego_challenge.jpg
          sh scripts/prepare-stego.sh
          git diff --exit-code -- public/uploads/stego_challenge.jpg
      - name: Exercise the preserved Docker startup workflow
        run: |
          mkdir -p "$RUNNER_TEMP/cosmolog-bin"
          printf '%s\n' '#!/bin/sh' 'exec docker compose "$@"' > "$RUNNER_TEMP/cosmolog-bin/docker-compose"
          chmod +x "$RUNNER_TEMP/cosmolog-bin/docker-compose"
          export PATH="$RUNNER_TEMP/cosmolog-bin:$PATH"
          touch database.sqlite
          docker-compose up -d
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:3000/uploads/stego_challenge.jpg -o /tmp/downloaded-stego.jpg
          steghide extract -sf /tmp/downloaded-stego.jpg -p cosmolog -xf /tmp/downloaded-flag.txt -f
          printf '%s\n' 'AstroSec{st3g0_s4t3ll1t3_s3cr3t}' > /tmp/expected-flag.txt
          cmp /tmp/expected-flag.txt /tmp/downloaded-flag.txt
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cosmolog-browser" playwright@1.58.2
          "$RUNNER_TEMP/cosmolog-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop and mobile browser flows
        env:
          NODE_PATH: ${{ runner.temp }}/cosmolog-browser/node_modules
        run: node tests/browser.cjs
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/containers.txt
          docker compose logs --no-color > artifacts/container-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmolog-lab-validation
          path: artifacts/
          retention-days: 7
      - name: Stop the lab
        if: always()
        run: docker compose down
